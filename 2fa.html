<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Why-PII? — Verify</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
  :root{
    --surface-0:#0b0e14;
    --surface-1:#131722;
    --surface-2:#1b2130;
    --surface-3:#232b3b;
    --border:#2a3242;
    --border-strong:#3a4458;
    --text-primary:#e6e9ef;
    --text-secondary:#aab2c0;
    --text-muted:#7a8494;
    --accent:#06b6d4;
    --accent-hover:#0891a8;
    --accent-soft:rgba(6,182,212,0.14);
    --focus-ring:#06b6d4;
    --error:#ff4d4f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--surface-0);
    color:var(--text-primary);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  .login-backdrop{
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,#020617 0%, #061229 35%, #0044cc 100%);
    z-index:0;
  }
  .glow{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.35;
    pointer-events:none;
  }
  .glow.one{width:520px;height:520px;background:#2f7df6;top:-120px;left:-100px;}
  .glow.two{width:460px;height:460px;background:#6366f1;bottom:-140px;right:-80px;}

  .login-card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:var(--surface-1);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    padding:40px 36px;
    animation:slideUp .5s ease;
  }
  @keyframes slideUp{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .app-mark{
    width:44px;height:44px;
    border-radius:10px;
    background:linear-gradient(135deg,#2f7df6,#6366f1);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
  }
  .app-mark i{font-size:24px; color:#fff;}

  .wordmark{
    text-align:center;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--text-secondary);
    margin-bottom:28px;
  }

  h1{
    font-size:22px;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
    letter-spacing:-0.01em;
  }
  .subhead{
    font-size:13px;
    color:var(--text-muted);
    text-align:center;
    line-height:1.5;
    margin-bottom:8px;
  }
  .subhead .mono{
    font-family:"SF Mono","Roboto Mono",monospace;
    color:var(--text-secondary);
  }

  .code-field{
    margin:28px 0 6px;
  }
  .code-inputs{
    display:flex;
    gap:8px;
  }
  .code-inputs input{
    width:100%;
    aspect-ratio:1;
    text-align:center;
    font-size:20px;
    font-weight:600;
    font-family:"SF Mono","Roboto Mono",monospace;
    color:var(--text-primary);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  /* fixes the original bug: placeholder must read as clearly empty,
     never mistakable for an entered value */
  .code-inputs input::placeholder{
    color:var(--text-muted);
    opacity:0.45;
    font-weight:500;
  }
  .code-inputs input:focus{
    border-color:var(--focus-ring);
    box-shadow:0 0 0 2px var(--accent-soft);
  }
  .code-inputs input.error{
    border-color:var(--error);
  }

  .timer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:16px 0 24px;
    font-size:12px;
    color:var(--text-muted);
  }
  .timer-row .mono{
    font-family:"SF Mono","Roboto Mono",monospace;
    color:var(--text-secondary);
    font-weight:600;
  }

  button.btn-primary{
    width:100%;
    padding:11px;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:16px;
  }
  button.btn-primary:hover{background:var(--accent-hover);}
  button.btn-primary:active{transform:translateY(1px);}
  button.btn-primary i{font-size:16px;}

  .back-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:13px;
    color:var(--text-muted);
    text-decoration:none;
  }
  .back-link:hover{color:var(--text-secondary);}
  .back-link i{font-size:14px;}

  .footer-meta{
    margin-top:24px;
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    font-family:"SF Mono","Roboto Mono",monospace;
  }
</style>
</head>
<body>

  <div class="login-backdrop">
    <div class="glow one"></div>
    <div class="glow two"></div>
  </div>

  <div class="login-card">
    <div class="app-mark">
      <i class="ph-duotone ph-shield-check"></i>
    </div>
    <div class="wordmark">WHY-PII?</div>

    <h1>Two-factor verification</h1>
    <p class="subhead">Enter the 6-digit code from your authenticator app for<br><span class="mono">analyst@company.com</span></p>

    <form>
      <div class="code-field">
        <div class="code-inputs">
          <input type="text" inputmode="numeric" maxlength="1" placeholder="–" autocomplete="one-time-code" autofocus>
          <input type="text" inputmode="numeric" maxlength="1" placeholder="–">
          <input type="text" inputmode="numeric" maxlength="1" placeholder="–">
          <input type="text" inputmode="numeric" maxlength="1" placeholder="–">
          <input type="text" inputmode="numeric" maxlength="1" placeholder="–">
          <input type="text" inputmode="numeric" maxlength="1" placeholder="–">
        </div>
      </div>

      <div class="timer-row" style="justify-content:center;">
        <span>Codes refresh automatically every <span class="mono">30s</span></span>
      </div>

      <button type="submit" class="btn-primary">
        Verify
        <i class="ph ph-arrow-right"></i>
      </button>
    </form>

    <a class="back-link" href="#">
      <i class="ph ph-arrow-left"></i>
      Back to login
    </a>

    <div class="footer-meta">SECURE CONNECTION · TLS 1.3</div>
  </div>

</body>
</html>
