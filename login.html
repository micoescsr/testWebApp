<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Why-PII? — Login</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
  :root{
    /* surfaces */
    --surface-0:#0b0e14;
    --surface-1:#131722;
    --surface-2:#1b2130;
    --surface-3:#232b3b;
    --border:#2a3242;
    --border-strong:#3a4458;
    /* text */
    --text-primary:#e6e9ef;
    --text-secondary:#aab2c0;
    --text-muted:#7a8494;
    /* accent */
    --accent:#06b6d4;
    --accent-hover:#0891a8;
    --accent-soft:rgba(6,182,212,0.14);
    --focus-ring:#06b6d4;
    /* severity (not used here but kept for reference) */
    --critical:#ff4d4f;
    --error:#ff4d4f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--surface-0);
    color:var(--text-primary);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* the one gradient moment in the whole system, per spec */
  .login-backdrop{
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,#020617 0%, #061229 35%, #0044cc 100%);
    z-index:0;
  }
  .glow{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.35;
    pointer-events:none;
  }
  .glow.one{
    width:520px;height:520px;
    background:#2f7df6;
    top:-120px;left:-100px;
  }
  .glow.two{
    width:460px;height:460px;
    background:#6366f1;
    bottom:-140px;right:-80px;
  }

  .login-card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:var(--surface-1);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    padding:40px 36px;
    animation:slideUp .5s ease;
  }
  @keyframes slideUp{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .app-mark{
    width:44px;height:44px;
    border-radius:10px;
    background:linear-gradient(135deg,#2f7df6,#6366f1);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
  }
  .app-mark i{font-size:24px; color:#fff;}

  .wordmark{
    text-align:center;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--text-secondary);
    margin-bottom:28px;
  }

  h1{
    font-size:22px;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
    letter-spacing:-0.01em;
  }
  .subhead{
    font-size:13px;
    color:var(--text-muted);
    text-align:center;
    margin-bottom:32px;
  }

  .field{
    margin-bottom:18px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-secondary);
    margin-bottom:8px;
  }
  .input-wrap{
    position:relative;
  }
  .input-wrap i{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-muted);
    font-size:16px;
    pointer-events:none;
  }
  input{
    width:100%;
    padding:11px 14px 11px 38px;
    font-size:14px;
    font-family:inherit;
    color:var(--text-primary);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{color:var(--text-muted);}
  input:focus{
    border-color:var(--focus-ring);
    box-shadow:0 0 0 2px var(--accent-soft);
  }
  input[type="password"]{
    padding-right:38px;
  }
  .toggle-visibility{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-muted);
    font-size:16px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    display:flex;
  }
  .toggle-visibility:hover{color:var(--text-secondary);}

  .row-end{
    display:flex;
    justify-content:flex-end;
    margin:8px 0 24px;
  }
  a.link{
    font-size:13px;
    color:var(--accent);
    text-decoration:none;
    font-weight:500;
  }
  a.link:hover{color:var(--accent-hover); text-decoration:underline;}

  button.btn-primary{
    width:100%;
    padding:11px;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  button.btn-primary:hover{background:var(--accent-hover);}
  button.btn-primary:active{transform:translateY(1px);}
  button.btn-primary i{font-size:16px;}

  .footer-meta{
    margin-top:28px;
    text-align:center;
    font-size:12px;
    color:var(--text-muted);
    font-family:"SF Mono","Roboto Mono",monospace;
  }
</style>
</head>
<body>

  <div class="login-backdrop">
    <div class="glow one"></div>
    <div class="glow two"></div>
  </div>

  <div class="login-card">
    <div class="app-mark">
      <i class="ph-duotone ph-globe-hemisphere-west"></i>
    </div>
    <div class="wordmark">WHY-PII?</div>

    <h1>Log in to your account</h1>
    <p class="subhead">Wi-Fi security console — analyst access only.</p>

    <form>
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <i class="ph ph-envelope-simple"></i>
          <input id="email" type="email" placeholder="analyst@company.com" autocomplete="email">
        </div>
      </div>

      <div class="field" style="margin-bottom:0;">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="ph ph-lock-simple"></i>
          <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-visibility" aria-label="Show password">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>

      <div class="row-end">
        <a class="link" href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">
        Log in
        <i class="ph ph-arrow-right"></i>
      </button>
    </form>

    <div class="footer-meta">SECURE CONNECTION · TLS 1.3</div>
  </div>

</body>
</html>
